<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changer de mot de passe — Résidence Les Cerisiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF1EE; --surface:#FFFFFF; --ink:#1B2523; --ink-soft:#5B6864; --ink-faint:#8B948F;
    --line:#DBDFD8; --navy:#1C2E33; --teal:#2E6E68; --rust:#B14B33; --rust-soft:#F6E4DF;
    --amber:#C97F1F; --amber-soft:#FBEDDA; --radius:10px; --shadow:0 1px 2px rgba(28,46,51,0.06), 0 6px 16px rgba(28,46,51,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:36px 32px; max-width:400px; width:100%;
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 6px; text-align:center;}
  h1{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:24px; text-transform:uppercase; margin:0 0 10px; color:var(--navy); text-align:center;}
  .intro{font-size:13.5px; color:var(--ink-soft); text-align:center; margin:0 0 24px; line-height:1.5;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .field label{font-size:12px; color:var(--ink-soft); font-weight:500;}
  .field input{
    font-family:inherit; font-size:14.5px; padding:11px 12px; border:1px solid var(--line);
    border-radius:8px; background:#FCFCFB; color:var(--ink);
  }
  button{
    width:100%; font-family:inherit; font-weight:600; font-size:14.5px; background:var(--navy);
    color:#fff; border:none; padding:12px; border-radius:8px; cursor:pointer; margin-top:6px;
  }
  button:hover{background:#132125;}
  button:disabled{opacity:.6; cursor:default;}
  .error{color:var(--rust); background:var(--rust-soft); border-radius:8px; padding:9px 12px; font-size:13px; margin:0 0 16px; display:none;}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Résidence Les Cerisiers</p>
    <h1>Nouveau mot de passe</h1>
    <p class="intro">Votre mot de passe actuel est temporaire. Choisissez-en un nouveau (8 caractères minimum) avant de continuer.</p>
    <p class="error" id="cp-error"></p>
    <form id="cp-form">
      <div class="field">
        <label for="current">Mot de passe temporaire actuel</label>
        <input id="current" type="password" autocomplete="current-password" required autofocus>
      </div>
      <div class="field">
        <label for="new1">Nouveau mot de passe</label>
        <input id="new1" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="field">
        <label for="new2">Confirmer le nouveau mot de passe</label>
        <input id="new2" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" id="submit-btn">Valider</button>
    </form>
  </div>
  <script>
    document.getElementById('cp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('cp-error');
      const btn = document.getElementById('submit-btn');
      errorEl.style.display = 'none';

      const newPassword = document.getElementById('new1').value;
      if(newPassword !== document.getElementById('new2').value){
        errorEl.textContent = 'Les deux mots de passe ne correspondent pas.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Validation...';
      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: document.getElementById('current').value,
            newPassword,
          }),
        });
        const body = await res.json();
        if(!res.ok){
          errorEl.textContent = body.error || 'Une erreur est survenue.';
          errorEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Valider';
          return;
        }
        window.location.href = '/app.html';
      } catch (err) {
        errorEl.textContent = 'Impossible de contacter le serveur. Réessayez.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Valider';
      }
    });
  </script>
</body>
</html>
