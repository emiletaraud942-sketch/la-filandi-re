<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résidence Les Cerisiers — Service Technique</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#6157b0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --text:#1b1d26;
    --text-muted:rgba(27,29,38,.55);
    --text-faint:rgba(27,29,38,.45);
    --accent:#6157b0;
    --accent-ink:#2b2470;
    --accent-active:#362e80;
    --accent-soft:#e6e3f5;
    --accent-wash:#f2f1f9;
    --divider:rgba(27,29,38,.12);
    --neutral-soft:#e6e8ee;
    --neutral-wash:#f4f5f8;
    --done:#3E7A4E;
    --doing:#C97F1F;
    --doing-ink:#241a00;
    --todo:#B14B33;
    --radius-md:8px;
    --radius-lg:14px;
    --shadow-sm:0 0 0 1px #e6e8ee;
    --shadow-lg:0 0 0 1px #d3d6e1, 0 16px 40px rgba(27,29,38,.15);
  }
  *,*::before,*::after{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  h1,h2,h3{font-family:'Inter',system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  #app{display:flex;flex-direction:column;min-height:100vh;}
  .loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--text-muted);font-size:15px;}
  .error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh;color:var(--text-muted);font-size:15px;text-align:center;padding:24px;}

  .app-header{padding:16px 22px 0;flex:none;}
  .header-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;}
  .header-row h1{flex:1 1 260px;min-width:0;font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .role-toggle{flex:none;display:inline-flex;overflow:hidden;border:1px solid var(--divider);border-radius:var(--radius-md);}
  .role-btn{padding:9px 16px;font-size:15px;font-weight:500;cursor:pointer;background:transparent;border:0;color:var(--text);white-space:nowrap;}
  .role-btn+.role-btn{border-left:1px solid var(--divider);}
  .role-btn.active{background:var(--accent-soft);color:var(--accent-ink);}
  .user-box{flex:none;display:flex;align-items:center;gap:10px;}
  .user-id{text-align:right;}
  .user-name{font-size:14px;white-space:nowrap;}
  .user-role{font-size:12.5px;color:var(--text-muted);white-space:nowrap;}
  .avatar{width:34px;height:34px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .avatar.sm{width:27px;height:27px;font-size:11px;}
  .avatar.muted{background:var(--neutral-soft);color:var(--text-faint);}
  .logout-btn{flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;border:1px solid var(--divider);border-radius:var(--radius-md);color:var(--text-muted);font-size:15px;}
  .logout-btn:hover{background:rgba(27,29,38,.05);color:var(--text);}

  .tabs-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 22px;margin-top:14px;box-shadow:inset 0 -1px 0 var(--divider);}
  .tabs{flex:1 1 auto;min-width:0;display:flex;gap:4px;overflow-x:auto;}
  .tab-btn{flex:none;display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;font-size:15px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--text-muted);}
  .tab-btn.active{color:var(--accent-active);border-bottom-color:var(--accent);}
  .tab-count{font-size:13px;padding:1px 7px;border-radius:999px;background:var(--neutral-wash);color:var(--text-faint);}
  .tab-btn.active .tab-count{background:var(--accent-soft);color:var(--accent-ink);}
  .day-nav{flex:none;display:flex;align-items:center;gap:10px;padding-bottom:7px;}
  .icon-btn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;border:1px solid var(--divider);border-radius:var(--radius-md);color:var(--text);font-size:15px;}
  .icon-btn:hover{background:rgba(27,29,38,.05);}
  .day-label{font-size:15px;white-space:nowrap;text-transform:capitalize;color:var(--text-muted);}
  .my-day-label{flex:1 1 auto;min-width:0;display:flex;align-items:center;padding:10px 0 12px;font-size:15px;white-space:nowrap;color:var(--accent-ink);border-bottom:2px solid var(--accent);}

  .week-strip{flex:none;display:flex;align-items:stretch;gap:8px;padding:14px 22px 0;}
  .week-strip-days{flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;}
  .week-card{flex:1 1 0;min-width:116px;display:flex;flex-direction:column;gap:7px;padding:10px 12px 11px;cursor:pointer;text-align:left;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:var(--radius-md);border:0;border-left:4px solid transparent;color:var(--text);}
  .week-card.active{background:var(--accent-wash);box-shadow:var(--shadow-lg);border-left-color:var(--accent);}
  .week-card.is-today:not(.active){border-left-color:var(--neutral-soft);}
  .week-card-top{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .week-card-num{font-size:21px;letter-spacing:-.02em;}
  .week-card-name{font-size:13px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);}
  .week-card.active .week-card-name{color:var(--accent-active);}
  .week-card-counts{display:flex;align-items:center;gap:9px;min-width:0;}
  .week-card-count{flex:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13.5px;}
  .week-card-dot{width:9px;height:9px;flex:none;border-radius:50%;}
  .week-card-task{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  main{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 22px 24px;}
  .section{min-width:0;margin-bottom:22px;}
  .section-head{display:flex;align-items:baseline;gap:11px;padding-bottom:9px;}
  .section-title{font-size:19px;font-weight:500;white-space:nowrap;}
  .section-sub{font-size:14px;white-space:nowrap;color:var(--text-muted);}
  .scroll-x{min-width:0;overflow-x:auto;}
  .grid-box{display:flex;flex-direction:column;gap:1px;background:var(--divider);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .grid-head{display:grid;gap:1px;padding:0 0 7px 14px;font-size:13px;color:var(--text-faint);}
  .grid-row{display:grid;gap:1px;}
  .cell{display:flex;align-items:center;min-height:52px;padding:8px 12px;background:var(--surface);border-left:4px solid transparent;}
  .cell.center{justify-content:center;text-align:center;}
  .cell-title{flex:1 1 auto;min-width:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cell-sub{display:block;font-size:13.5px;margin-top:2px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill-btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px;cursor:pointer;font-size:14.5px;border:0;white-space:nowrap;}
  .pill-btn:disabled{cursor:default;opacity:.6;}
  .empty-row{display:flex;align-items:center;min-height:52px;padding:10px 16px;background:var(--surface);font-size:14.5px;color:var(--text-faint);}
  .add-row{width:100%;display:flex;align-items:center;gap:9px;min-height:48px;padding:8px 16px;cursor:pointer;text-align:left;font-size:14.5px;background:var(--surface);border:0;border-top:1px solid var(--divider);color:var(--text-muted);}
  .add-row .plus{font-size:17px;color:var(--accent);}
  .add-row:hover{background:rgba(27,29,38,.03);}

  .bar-track{flex:1 1 auto;min-width:0;height:8px;border-radius:4px;background:var(--neutral-soft);}
  .bar-fill{display:block;height:8px;border-radius:4px;}

  .status-card{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:14px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);margin-bottom:22px;}
  .status-dot{width:13px;height:13px;flex:none;border-radius:50%;}
  .status-label{flex:1 1 200px;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status-shift{flex:none;font-size:15px;color:var(--text-muted);white-space:nowrap;}
  .hint-text{font-size:13.5px;padding-top:9px;color:var(--text-faint);}

  .week-row{width:100%;display:grid;gap:1px;cursor:pointer;text-align:left;color:var(--text);background:transparent;border:0;}
  .week-day{display:flex;align-items:center;min-height:54px;padding:8px 14px;border-left:4px solid transparent;font-size:15px;text-transform:capitalize;white-space:nowrap;}
  .week-state{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px;font-size:14.5px;white-space:nowrap;}
  .week-detail{display:flex;align-items:center;min-height:54px;padding:8px 14px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);}
  .week-tasks{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px;font-size:14px;white-space:nowrap;color:var(--text-faint);}

  .dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(244,245,248,.72);z-index:200;}
  .dialog{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-lg);}
  .dialog-title{font-size:20px;font-weight:500;}
  .dialog-body{display:flex;flex-direction:column;gap:12px;font-size:14px;}
  .dialog-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field label{display:block;font-size:12px;margin-bottom:5px;color:var(--text-muted);}
  .field .input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius-md);}
  .field .input:hover{border-color:rgba(27,29,38,.35);}
  .field .input:focus-visible{border-color:var(--accent);outline-offset:0;}
  .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:500;font-size:14px;padding:8px 14px;border-radius:var(--radius-md);border:1px solid transparent;}
  .btn-secondary{border-color:var(--divider);color:var(--text);}
  .btn-secondary:hover{background:rgba(27,29,38,.05);}
  .btn-primary{border-color:var(--accent);color:var(--accent);}
  .btn-primary:hover{background:rgba(97,87,176,.1);}

  @media (max-width:640px){
    .header-row h1{font-size:22px;}
    .app-header{padding:14px 14px 0;}
    main{padding:14px 14px 20px;}
  }

  .msg-fab{position:fixed;right:20px;bottom:20px;z-index:150;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg);}
  .msg-fab:hover{background:var(--accent-active);}
  .msg-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--todo);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .msg-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(244,245,248,.72);z-index:220;}
  .msg-window{width:min(440px,100%);height:min(600px,80vh);display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-lg);overflow:hidden;}
  .msg-header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--divider);font-size:16px;font-weight:600;}
  .msg-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
  .msg-item-head{display:flex;align-items:baseline;gap:8px;}
  .msg-item-author{font-size:13px;font-weight:600;color:var(--accent-ink);}
  .msg-item-time{font-size:11.5px;color:var(--text-faint);}
  .msg-item-body{font-size:14.5px;white-space:pre-wrap;word-break:break-word;margin-top:2px;}
  .msg-empty{color:var(--text-faint);font-size:14px;text-align:center;padding:24px 0;}
  .msg-form{flex:none;display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--divider);}
  .msg-form input{flex:1 1 auto;min-width:0;}
  .offline-banner{flex:none;padding:8px 16px;background:var(--todo);color:#fff;font-size:13px;text-align:center;}

  .admin-btn{flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;border:1px solid var(--divider);border-radius:var(--radius-md);color:var(--text-muted);font-size:15px;}
  .admin-btn:hover{background:rgba(27,29,38,.05);color:var(--text);}
  .admin-window{width:min(760px,95vw);height:min(640px,85vh);display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-lg);overflow:hidden;}
  .admin-tabs{flex:none;display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--divider);}
  .admin-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px;}
  .admin-section{margin-bottom:22px;}
  .admin-section h3{font-size:15px;font-weight:600;margin:0 0 10px;}
  .admin-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow-sm);margin-bottom:6px;flex-wrap:wrap;}
  .admin-row .grow{flex:1 1 160px;min-width:0;}
  .admin-row .muted{color:var(--text-faint);font-size:13px;}
  .admin-form{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px;padding:12px;border-radius:8px;background:var(--neutral-wash);}
  .admin-form .field{margin:0;min-width:130px;}
  .btn-sm{padding:6px 10px;font-size:13px;}
  .btn-danger{border-color:var(--todo);color:var(--todo);}
  .btn-danger:hover{background:rgba(177,75,51,.08);}
  .audit-item{padding:8px 10px;border-bottom:1px solid var(--divider);font-size:13.5px;}
  .audit-item .muted{color:var(--text-faint);font-size:12px;}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Chargement…</div></div>

<button id="msg-fab" class="msg-fab" aria-label="Messages d'équipe" hidden>💬<span id="msg-badge" class="msg-badge" hidden></span></button>
<div id="msg-backdrop" class="msg-backdrop" hidden>
  <div class="msg-window">
    <div class="msg-header"><span>Messages d'équipe</span><button id="msg-close" class="icon-btn" aria-label="Fermer">✕</button></div>
    <div id="msg-list" class="msg-list"></div>
    <form id="msg-form" class="msg-form">
      <input id="msg-input" class="input" placeholder="Écrire un message…" autocomplete="off" maxlength="2000">
      <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
  </div>
</div>

<div id="admin-backdrop" class="msg-backdrop" hidden>
  <div class="admin-window">
    <div class="msg-header"><span>Administration</span><button id="admin-close" class="icon-btn" aria-label="Fermer">✕</button></div>
    <div class="admin-tabs">
      <button class="tab-btn active" data-admin-tab="accounts">Comptes</button>
      <button class="tab-btn" data-admin-tab="team">Équipe</button>
      <button class="tab-btn" data-admin-tab="log">Journal d'audit</button>
    </div>
    <div id="admin-body" class="admin-body"></div>
  </div>
</div>

<script>
(function(){
  const SITES = [
    { id: 'CLF', name: 'Clairefontaine', color: '#4F44B0' },
    { id: 'BMT', name: 'Beaumont', color: '#3F7F94' }
  ];

  const SHIFTS = {
    matin: { s: 6, short: '06:00 – 14:00', name: 'Matin' },
    aprem: { s: 13.5, short: '13:30 – 21:30', name: 'Après-midi' }
  };

  const STATES = {
    done: { label: 'Terminé', bg: 'var(--done)', fg: '#ffffff' },
    doing: { label: 'En cours', bg: 'var(--doing)', fg: 'var(--doing-ink)' },
    todo: { label: 'À faire', bg: 'var(--todo)', fg: '#ffffff' }
  };
  const CYCLE = { todo: 'doing', doing: 'done', done: 'todo' };

  const PRES = {
    present: { label: 'Présent', bg: 'var(--done)', fg: '#ffffff' },
    moved: { label: 'Autre site', bg: 'var(--doing)', fg: 'var(--doing-ink)' },
    absent: { label: 'Absent', bg: 'var(--todo)', fg: '#ffffff' },
    off: { label: 'Repos', bg: 'var(--neutral-wash)', fg: 'var(--text-faint)' }
  };

  const CLEAN = {
    ok: { label: 'Propre', bg: 'var(--done)', fg: '#ffffff' },
    soon: { label: 'À nettoyer', bg: 'var(--doing)', fg: 'var(--doing-ink)' },
    urgent: { label: 'Urgent', bg: 'var(--todo)', fg: '#ffffff' }
  };
  const CLEAN_CYCLE = { ok: 'soon', soon: 'urgent', urgent: 'ok' };

  const TASK_POOL = [
    { t: 'Ronde de contrôle chaudière', u: '' },
    { t: 'Remplacer les néons du couloir B', u: '' },
    { t: 'Réparer la barre d’appui ch. 214', u: 'Urgent' },
    { t: 'Relevé des compteurs d’eau', u: '' },
    { t: 'Déboucher l’évier de l’office 2', u: 'Urgent' },
    { t: 'Entretien des espaces verts', u: '' },
    { t: 'Contrôle des issues de secours', u: '' },
    { t: 'Monter le lit médicalisé ch. 108', u: 'Urgent' },
    { t: 'Purger les radiateurs aile Est', u: '' },
    { t: 'Vérifier les détecteurs de fumée', u: '' },
    { t: 'Régler le groupe froid cuisine', u: 'Urgent' },
    { t: 'Peinture de la salle de kiné', u: '' },
    { t: 'Changer les filtres VMC', u: '' },
    { t: 'Réparer le store ch. 301', u: '' }
  ];

  const WORKS = [
    { title: 'Réfection des salles de bain — aile Est', pct: 62, site: 'CLF', who: 'Sophie Berthier', due: 'J-17', late: false },
    { title: 'Mise aux normes électriques du sous-sol', pct: 38, site: 'BMT', who: 'Émilie Charpentier', due: 'En retard', late: true },
    { title: 'Remplacement de la VMC cuisine', pct: 80, site: 'CLF', who: 'Antoine Lefort', due: 'J-4', late: false },
    { title: 'Réaménagement du local technique', pct: 15, site: 'BMT', who: 'Isabelle Faure', due: 'J-31', late: false }
  ];
  // Chantiers : encore une donnée de démonstration statique — le module
  // "chantiers" réel (table `projects` déjà en base) sera branché ici dans
  // une phase ultérieure.

  const DAY = 86400000;
  function initials(n) { return n.split(' ').map(function (p) { return p[0]; }).join('').slice(0, 2).toUpperCase(); }
  function key(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dayIndex(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function hourLabel(h) { return (h % 1 ? Math.floor(h) + 'h30' : h + 'h00'); }
  function siteName(id) { const s = SITES.filter(function (x) { return x.id === id; })[0]; return s ? s.name : id; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' }[c]; }); }
  function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  const fmtDayFull = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtShort = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' });
  const fmtWeekday = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric' });
  const fmtDayName = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' });

  const today = startOfDay(new Date());

  // ---------- Données réelles (chargées depuis l'API au démarrage) ----------
  let STAFF = [];
  let ABSENCES = [];
  let SESSION = null; // { username, role: 'manager'|'agent', teamMemberId }
  let ZONES = [];

  const state = {
    role: 'chef', tab: 'planning', selected: today,
    status: {}, clean: {}, extra: {},
    dialog: false
  };

  async function apiCall(url, opts) {
    const res = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
    if (!res.ok) {
      const body = await res.json().catch(function () { return {}; });
      throw new Error(body.error || ('Erreur ' + res.status));
    }
    return res.status === 204 ? null : res.json();
  }

  function absenceFor(pid, d) {
    const t = d.getTime();
    for (let i = 0; i < ABSENCES.length; i++) {
      const a = ABSENCES[i];
      if (a.pid === pid && t >= a.from.getTime() && t <= a.to.getTime()) return a;
    }
    return null;
  }

  function roster(d) {
    const di = dayIndex(d);
    const dow = d.getDay();
    const weekend = dow === 0 || dow === 6;
    return STAFF.map(function (p, i) {
      const abs = absenceFor(p.id, d);
      let shift = null;
      const r = (i * 2 + di) % 5;
      if (!abs) {
        if (weekend) shift = r === 0 ? 'matin' : (r === 1 ? 'aprem' : null);
        else shift = r < 2 ? 'matin' : (r < 4 ? 'aprem' : null);
      }
      const lent = !!shift && (i + di) % 5 === 4;
      return { p: p, shift: shift, abs: abs, site: lent ? (p.s === 'CLF' ? 'BMT' : 'CLF') : p.s, lent: lent };
    });
  }

  function baseState(d, seed) {
    const diff = Math.round((d.getTime() - today.getTime()) / DAY);
    if (diff < 0) return seed % 6 === 0 ? 'doing' : 'done';
    if (diff === 0) return seed % 3 === 0 ? 'done' : (seed % 3 === 1 ? 'doing' : 'todo');
    return seed % 7 === 0 ? 'doing' : 'todo';
  }

  function tasksFor(d) {
    const di = dayIndex(d);
    const k = key(d);
    const out = [];
    roster(d).forEach(function (row, i) {
      if (!row.shift) return;
      if ((i + di) % 2 === 1) return;
      const src = TASK_POOL[(i * 5 + di * 3) % TASK_POOL.length];
      const id = k + '|' + row.p.id;
      out.push({
        id: id, title: src.t, urg: src.u, pid: row.p.id, person: row.p.n,
        site: row.site, shift: row.shift, hour: SHIFTS[row.shift].s + 1,
        state: state.status[id] || baseState(d, i + di)
      });
    });
    (state.extra[k] || []).forEach(function (t) {
      out.push(Object.assign({}, t, { state: state.status[t.id] || 'todo' }));
    });
    return out;
  }

  function setStatus(id, cur) {
    const next = CYCLE[cur];
    state.status[id] = next;
    render();
    apiCall('/api/task-status', { method: 'POST', body: JSON.stringify({ taskId: id, status: next }) })
      .catch(function (e) { alert(e.message); });
  }

  function taskRow(t) {
    const st = STATES[t.state];
    return {
      id: t.id,
      title: t.title,
      who: t.person,
      initials: initials(t.person),
      status: st.label, statusBg: st.bg, statusFg: st.fg,
      slot: t.shift ? SHIFTS[t.shift].name : hourLabel(t.hour),
      meta: siteName(t.site) + ' · ' + hourLabel(t.hour),
      urg: t.urg, urgFg: t.urg ? 'var(--todo)' : 'transparent',
      op: t.state === 'done' ? '0.55' : '1',
      deco: t.state === 'done' ? 'line-through' : 'none'
    };
  }

  function planningGroups(sel, tasks) {
    const rank = { todo: 0, doing: 1, done: 2 };
    return SITES.map(function (st) {
      const rows = tasks.filter(function (t) { return t.site === st.id; }).sort(function (a, b) {
        if (rank[a.state] !== rank[b.state]) return rank[a.state] - rank[b.state];
        return (b.urg ? 1 : 0) - (a.urg ? 1 : 0);
      });
      const done = rows.filter(function (t) { return t.state === 'done'; }).length;
      return {
        id: st.id, name: st.name, color: st.color,
        summary: rows.length ? done + ' / ' + rows.length + ' terminées' : 'aucune tâche',
        rows: rows.map(taskRow)
      };
    });
  }

  function teamGroups(roster_) {
    return SITES.map(function (st) {
      const here = roster_.filter(function (r) { return r.shift && r.site === st.id; });
      const off = roster_.filter(function (r) { return !r.shift && r.p.s === st.id; });
      const rows = [];
      here.forEach(function (r) {
        const p = r.lent ? PRES.moved : PRES.present;
        rows.push({
          name: r.p.n, initials: initials(r.p.n), muted: false,
          state: p.label, stateBg: p.bg, stateFg: p.fg,
          slot: SHIFTS[r.shift].name,
          detail: r.lent ? 'prêté depuis ' + siteName(r.p.s) : SHIFTS[r.shift].short
        });
      });
      off.forEach(function (r) {
        const p = r.abs ? PRES.absent : PRES.off;
        rows.push({
          name: r.p.n, initials: initials(r.p.n), muted: true,
          state: p.label, stateBg: p.bg, stateFg: p.fg,
          slot: '—',
          detail: r.abs ? r.abs.kind : 'Jour de repos'
        });
      });
      return {
        name: st.name, color: st.color,
        summary: here.length + ' au poste · ' + off.filter(function (r) { return r.abs; }).length + ' absents',
        people: rows
      };
    });
  }

  function worksData() {
    const urgentZones = ZONES.filter(function (z) { return (state.clean[z.id] || z.base) === 'urgent'; }).length;
    const works = WORKS.map(function (w) {
      const st = SITES.filter(function (x) { return x.id === w.site; })[0];
      return {
        title: w.title, pct: w.pct, who: w.who, initials: initials(w.who),
        site: siteName(w.site), mark: st.color,
        barFg: w.late ? 'var(--doing)' : 'var(--accent)',
        due: w.due, dueFg: w.late ? 'var(--todo)' : 'var(--text-muted)'
      };
    });
    const zones = ZONES.map(function (z) {
      const st = state.clean[z.id] || z.base;
      const c = CLEAN[st];
      const site = SITES.filter(function (x) { return x.id === z.site; })[0];
      return { id: z.id, name: z.name, site: siteName(z.site), mark: site.color, label: c.label, bg: c.bg, fg: c.fg };
    });
    return {
      worksSummary: WORKS.length + ' en cours · ' + WORKS.filter(function (w) { return w.late; }).length + ' en retard',
      works: works, zones: zones,
      cleanAlert: urgentZones ? urgentZones + ' zone' + (urgentZones > 1 ? 's' : '') + ' à traiter en urgence' : 'rien d’urgent',
      cleanAlertFg: urgentZones ? 'var(--todo)' : 'var(--text-faint)'
    };
  }

  function getMe() {
    if (SESSION.teamMemberId) {
      const m = STAFF.filter(function (p) { return p.id === SESSION.teamMemberId; })[0];
      if (m) return m;
    }
    return { id: 0, n: SESSION.username, r: 'Responsable technique', s: '' };
  }

  function computeVals() {
    const s = state;
    const sel = s.selected;
    const isChef = s.role === 'chef';
    const ros = roster(sel);
    const tasks = tasksFor(sel);
    const me = getMe();

    const tab = isChef ? s.tab : 'mine';
    const openTasks = tasks.filter(function (t) { return t.state !== 'done'; }).length;
    const urgentZones = ZONES.filter(function (z) { return (s.clean[z.id] || z.base) === 'urgent'; }).length;

    const tabs = [
      { id: 'planning', label: 'Tâches du jour', count: openTasks },
      { id: 'team', label: 'Qui est où', count: ros.filter(function (r) { return r.shift; }).length },
      { id: 'works', label: 'Chantiers et propreté', count: WORKS.length + urgentZones }
    ];

    const vals = {
      isChef: isChef, isEmp: !isChef, tab: tab,
      canToggleRole: SESSION.role === 'manager',
      userName: me.n,
      userRole: isChef ? (SESSION.role === 'manager' ? (me.r || 'Chef d’équipe') : 'Chef d’équipe') : me.r + (me.s ? ' · ' + siteName(me.s) : ''),
      userInitials: initials(me.n),
      dayLabel: sel.getTime() === today.getTime() ? 'Aujourd’hui · ' + fmtShort.format(sel) : fmtDayFull.format(sel),
      tabs: tabs
    };

    const stripStart = addDays(sel, -((sel.getDay() + 6) % 7));
    vals.weekDays = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(stripStart, i);
      const on = d.getTime() === sel.getTime();
      const isToday = d.getTime() === today.getTime();
      const rst = roster(d);
      const ts = tasksFor(d);
      const openN = ts.filter(function (t) { return t.state !== 'done'; }).length;
      vals.weekDays.push({
        iso: isoDate(d),
        num: d.getDate(),
        dayName: fmtDayName.format(d),
        active: on, isToday: isToday,
        presentN: rst.filter(function (r) { return r.shift; }).length,
        absentN: rst.filter(function (r) { return r.abs; }).length,
        taskLabel: openN ? openN + ' à faire' : 'tout est fait',
        taskFg: openN ? 'var(--todo)' : 'var(--text-faint)'
      });
    }

    if (isChef && tab === 'planning') vals.groups = planningGroups(sel, tasks);
    if (isChef && tab === 'team') vals.teamGroups = teamGroups(ros);
    if (isChef && tab === 'works') Object.assign(vals, worksData());

    if (tab === 'mine') {
      const myRow = ros.filter(function (r) { return r.p.id === me.id; })[0];
      const myState = myRow && myRow.shift ? (myRow.lent ? PRES.moved : PRES.present) : (myRow && myRow.abs ? PRES.absent : PRES.off);
      vals.myStatusColor = myState.bg;
      vals.myStatusLabel = myRow && myRow.shift
        ? 'Site de ' + siteName(myRow.site) + (myRow.lent ? ' (prêté)' : '')
        : (myRow && myRow.abs ? myRow.abs.kind : 'Jour de repos');
      vals.myShiftLabel = myRow && myRow.shift ? SHIFTS[myRow.shift].short : '';
      const mine = tasks.filter(function (t) { return t.pid === me.id; });
      vals.myTasks = mine.map(taskRow);
      vals.myEmptyLabel = myRow && myRow.shift ? 'Aucune tâche assignée' : 'Pas de service ce jour';
      vals.myProgress = mine.length ? mine.filter(function (t) { return t.state === 'done'; }).length + ' / ' + mine.length + ' terminées' : '';

      const wStart = stripStart;
      vals.weekLabel = 'du ' + fmtShort.format(wStart) + ' au ' + fmtShort.format(addDays(wStart, 6));
      const myWeek = [];
      for (let i = 0; i < 7; i++) {
        const d = addDays(wStart, i);
        const row = roster(d).filter(function (r) { return r.p.id === me.id; })[0];
        const n = tasksFor(d).filter(function (t) { return t.pid === me.id; }).length;
        const p = row && row.shift ? (row.lent ? PRES.moved : PRES.present) : (row && row.abs ? PRES.absent : PRES.off);
        const on = d.getTime() === sel.getTime();
        myWeek.push({
          date: key(d), iso: isoDate(d),
          day: fmtWeekday.format(d),
          dayFg: on ? 'var(--accent-active)' : 'var(--text)',
          mark: on ? 'var(--accent)' : 'transparent',
          rowBg: on ? 'var(--accent-wash)' : 'var(--surface)',
          state: p.label, stateBg: p.bg, stateFg: p.fg,
          detail: row && row.shift ? SHIFTS[row.shift].short + ' · ' + siteName(row.site) : (row && row.abs ? row.abs.kind : 'Repos'),
          tasks: row && row.shift && n ? n + (n > 1 ? ' tâches' : ' tâche') : ''
        });
      }
      vals.myWeek = myWeek;
    }

    return vals;
  }

        '<span class="status-label">' + esc(v.myStatusLabel) + '</span>' +
        '<span class="status-shift">' + esc(v.myShiftLabel) + '</span>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><span class="section-title">Mes tâches</span><span class="section-sub">' + esc(v.myProgress) + '</span></div>' +
        '<div class="grid-box">' + taskRows + '</div>' +
        '<div class="hint-text">Touchez le statut pour le changer.</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><span class="section-title">Ma semaine</span><span class="section-sub">' + esc(v.weekLabel) + '</span></div>' +
        '<div class="grid-box">' + weekRows + '</div>' +
        '<div class="hint-text"><a href="/api/ics" target="_blank" rel="noopener">Exporter mon planning (.ics, Outlook/Google Agenda)</a></div>' +
      '</div>' +
    '</div>';
  }

  function dialogHtml() {
    if (!state.dialog) return '';
    const staffOptions = STAFF.filter(function (p) { return p.r === 'Agent technique'; })
      .map(function (p) { return '<option value="' + p.id + '"' + (p.id === state.dialog.person ? ' selected' : '') + '>' + esc(p.n + ' · ' + p.r) + '</option>'; }).join('');
    const siteOptions = SITES.map(function (s) { return '<option value="' + s.id + '"' + (s.id === state.dialog.site ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
    return '<div class="dialog-backdrop" data-action="dialog-backdrop">' +
      '<div class="dialog">' +
        '<div class="dialog-title">Nouvelle tâche</div>' +
        '<div class="dialog-body">' +
          '<div class="field"><label>Quoi</label><input class="input" id="dlg-title" placeholder="Ex. Réparer la porte du local 12"></div>' +
          '<div class="field"><label>Qui</label><select class="input" id="dlg-person">' + staffOptions + '</select></div>' +
          '<div class="dialog-row">' +
            '<div class="field"><label>Où</label><select class="input" id="dlg-site">' + siteOptions + '</select></div>' +
            '<div class="field"><label>Urgence</label><select class="input" id="dlg-urg"><option value="Normal">Normal</option><option value="Urgent">Urgent</option></select></div>' +
          '</div>' +
        '</div>' +
        '<div class="dialog-actions">' +
          '<button class="btn btn-secondary" data-action="dialog-close">Annuler</button>' +
          '<button class="btn btn-primary" data-action="dialog-submit">Ajouter</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function render() {
    const v = computeVals();
    let mainHtml;
    if (v.tab === 'planning') mainHtml = planningHtml(v);
    else if (v.tab === 'team') mainHtml = teamHtml(v);
    else if (v.tab === 'works') mainHtml = worksHtml(v);
    else mainHtml = mineHtml(v);

    document.getElementById('app').innerHTML =
      '<header class="app-header">' + headerHtml(v) + '</header>' +
      '<main>' + mainHtml + '</main>' +
      dialogHtml();
  }

  document.getElementById('app').addEventListener('click', function (e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'role') { if (SESSION.role === 'manager') { state.role = el.dataset.role; if (state.role === 'chef') state.tab = 'planning'; render(); } }
    else if (action === 'tab') { if (state.role === 'chef') { state.tab = el.dataset.tab; render(); } }
    else if (action === 'prev-week') { state.selected = addDays(state.selected, -7); render(); }
    else if (action === 'next-week') { state.selected = addDays(state.selected, 7); render(); }
    else if (action === 'cycle-task') {
      const id = el.dataset.id;
      const tasks = tasksFor(state.selected);
      const t = tasks.filter(function (x) { return x.id === id; })[0];
      if (t) setStatus(id, t.state);
    }
    else if (action === 'cycle-zone') {
      if (SESSION.role !== 'manager') return;
      const id = el.dataset.id;
      const z = ZONES.filter(function (x) { return x.id === id; })[0];
      const cur = state.clean[id] || z.base;
      const next = CLEAN_CYCLE[cur];
      state.clean[id] = next;
      render();
      apiCall('/api/zones/' + encodeURIComponent(id) + '/status', { method: 'POST', body: JSON.stringify({ status: next }) })
        .catch(function (e) { alert(e.message); });
    }
    else if (action === 'add-task') {
      if (SESSION.role !== 'manager') return;
      const firstAgent = STAFF.filter(function (p) { return p.r === 'Agent technique'; })[0];
      state.dialog = { title: '', person: firstAgent ? firstAgent.id : null, site: el.dataset.site, urg: 'Normal' };
      render();
    }
    else if (action === 'dialog-backdrop') { if (e.target !== el) return; state.dialog = false; render(); }
    else if (action === 'dialog-close') { state.dialog = false; render(); }
    else if (action === 'dialog-submit') {
      const title = document.getElementById('dlg-title').value.trim();
      if (title) {
        const pid = Number(document.getElementById('dlg-person').value);
        const site = document.getElementById('dlg-site').value;
        const urg = document.getElementById('dlg-urg').value;
        const p = STAFF.filter(function (x) { return x.id === pid; })[0];
        const dayIso = isoDate(state.selected);
        const selKey = key(state.selected);
        state.dialog = false;
        apiCall('/api/tasks', {
          method: 'POST',
          body: JSON.stringify({ day: dayIso, title: title, urgent: urg === 'Urgent', memberId: pid, site: site })
        }).then(function (row) {
          const list = (state.extra[selKey] || []).slice();
          list.push({
            id: selKey + '|x' + row.id + '|' + pid,
            title: title, urg: urg === 'Urgent' ? 'Urgent' : '',
            pid: pid, person: p.n, site: site, shift: null, hour: 9
          });
          state.extra[selKey] = list;
          render();
        }).catch(function (e) { alert(e.message); render(); });
        return;
      }
      state.dialog = false;
      render();
    }
    else if (action === 'pick-day') { state.selected = new Date(el.dataset.date + 'T00:00:00'); render(); }
    else if (action === 'open-admin') { openAdmin(); }
    else if (action === 'logout') {
      apiCall('/api/auth/logout', { method: 'POST' }).finally(function () { window.location.href = '/login.html'; });
    }
  });

  // ---------- Administration (lot 09) & journal d'audit (lot 08) ----------
  let ADMIN_TAB = 'accounts';
  let ADMIN_USERS = [];
  let ADMIN_TEAM = [];
  let ADMIN_LOG = [];
  let ADMIN_LOG_MORE = true;

  function fmtAuditTime(iso) {
    return new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function renderAdminBody() {
    const body = document.getElementById('admin-body');
    if (ADMIN_TAB === 'accounts') {
      const rows = ADMIN_USERS.map(function (u) {
        return '<div class="admin-row">' +
          '<span class="grow"><strong>' + esc(u.username) + '</strong> — ' + (u.role === 'manager' ? 'Responsable/Chef' : 'Agent') +
          (u.teamMemberName ? ' · ' + esc(u.teamMemberName) : '') + '</span>' +
          '<span class="muted">' + (u.lastLoginAt ? 'dernière connexion ' + fmtAuditTime(u.lastLoginAt) : 'jamais connecté') + '</span>' +
          '<button class="btn btn-secondary btn-sm" data-admin-action="reset-password" data-id="' + u.id + '">Réinitialiser le mot de passe</button>' +
          '<button class="btn btn-danger btn-sm" data-admin-action="delete-user" data-id="' + u.id + '">Supprimer le compte</button>' +
        '</div>';
      }).join('') || '<p class="muted">Aucun compte.</p>';

      const memberOptions = ADMIN_TEAM.filter(function (m) {
        return m.active && !ADMIN_USERS.some(function (u) { return u.teamMemberId === m.id; });
      }).map(function (m) { return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('');

      body.innerHTML =
        '<div class="admin-section"><h3>Comptes de connexion</h3>' + rows +
          '<form class="admin-form" id="create-account-form">' +
            '<div class="field"><label>Identifiant</label><input class="input" id="acc-username" required></div>' +
            '<div class="field"><label>Mot de passe temporaire</label><input class="input" id="acc-password" required minlength="8"></div>' +
            '<div class="field"><label>Rôle</label><select class="input" id="acc-role"><option value="agent">Agent</option><option value="manager">Responsable/Chef</option></select></div>' +
            '<div class="field" id="acc-member-field"><label>Membre d\'équipe</label><select class="input" id="acc-member">' + memberOptions + '</select></div>' +
            '<button type="submit" class="btn btn-primary btn-sm">Créer le compte</button>' +
          '</form>' +
        '</div>';
    } else if (ADMIN_TAB === 'team') {
      const rows = ADMIN_TEAM.map(function (m) {
        return '<div class="admin-row">' +
          '<span class="grow">' + esc(m.name) + ' — ' + esc(m.trade) + ' · ' + esc(siteName(m.site)) + (m.active ? '' : ' (désactivé)') + '</span>' +
          '<a class="btn btn-secondary btn-sm" href="/api/ics?memberId=' + m.id + '" target="_blank" rel="noopener">.ics</a>' +
          '<button class="btn btn-secondary btn-sm" data-admin-action="toggle-team" data-id="' + m.id + '" data-active="' + (!m.active) + '">' + (m.active ? 'Désactiver' : 'Réactiver') + '</button>' +
          '<button class="btn btn-danger btn-sm" data-admin-action="delete-team" data-id="' + m.id + '">Supprimer définitivement</button>' +
        '</div>';
      }).join('') || '<p class="muted">Équipe vide.</p>';

      body.innerHTML =
        '<div class="admin-section"><h3>Équipe (' + ADMIN_TEAM.length + ')</h3>' + rows +
          '<form class="admin-form" id="create-member-form">' +
            '<div class="field"><label>Nom</label><input class="input" id="mem-name" required></div>' +
            '<div class="field"><label>Fonction</label><input class="input" id="mem-trade" placeholder="Agent technique" required></div>' +
            '<div class="field"><label>Site</label><select class="input" id="mem-site"><option value="CLF">Clairefontaine</option><option value="BMT">Beaumont</option></select></div>' +
            '<div class="field"><label>Téléphone</label><input class="input" id="mem-phone"></div>' +
            '<button type="submit" class="btn btn-primary btn-sm">Ajouter à l\'équipe</button>' +
          '</form>' +
        '</div>';
    } else {
      const rows = ADMIN_LOG.map(function (e) {
        return '<div class="audit-item"><strong>' + esc(e.actorName) + '</strong> — ' + esc(e.action) +
          (e.target ? ' (' + esc(e.target) + ')' : '') + (e.details ? ' : ' + esc(e.details) : '') +
          '<div class="muted">' + fmtAuditTime(e.createdAt) + '</div></div>';
      }).join('') || '<p class="muted">Aucune entrée.</p>';
      body.innerHTML =
        '<div class="admin-section"><h3>Journal d\'audit</h3>' + rows +
          (ADMIN_LOG_MORE ? '<button class="btn btn-secondary btn-sm" id="audit-load-more" style="margin-top:8px">Charger plus</button>' : '') +
        '</div>';
      const btn = document.getElementById('audit-load-more');
      if (btn) btn.addEventListener('click', function () { loadAuditLog(true); });
    }

    const createAccountForm = document.getElementById('create-account-form');
    if (createAccountForm) createAccountForm.addEventListener('submit', onCreateAccount);
    const createMemberForm = document.getElementById('create-member-form');
    if (createMemberForm) createMemberForm.addEventListener('submit', onCreateMember);
  }

  function loadAdminAccounts() {
    return apiCall('/api/admin/users').then(function (r) { ADMIN_USERS = r; });
  }
  function loadAdminTeam() {
    return apiCall('/api/team').then(function (r) { ADMIN_TEAM = r; });
  }
  function loadAuditLog(append) {
    const before = append && ADMIN_LOG.length ? ADMIN_LOG[ADMIN_LOG.length - 1].id : 0;
    return apiCall('/api/admin/audit-log' + (before ? '?before=' + before : '')).then(function (r) {
      ADMIN_LOG_MORE = r.entries.length === 50;
      ADMIN_LOG = append ? ADMIN_LOG.concat(r.entries) : r.entries;
      renderAdminBody();
    });
  }

  function onCreateAccount(e) {
    e.preventDefault();
    const username = document.getElementById('acc-username').value.trim();
    const password = document.getElementById('acc-password').value;
    const role = document.getElementById('acc-role').value;
    const memberSel = document.getElementById('acc-member');
    const teamMemberId = memberSel && memberSel.value ? Number(memberSel.value) : null;
    apiCall('/api/admin/users', {
      method: 'POST',
      body: JSON.stringify({ username: username, tempPassword: password, role: role, teamMemberId: teamMemberId })
    }).then(function () { return loadAdminAccounts(); }).then(renderAdminBody).catch(function (err) { alert(err.message); });
  }

  function onCreateMember(e) {
    e.preventDefault();
    const name = document.getElementById('mem-name').value.trim();
    const trade = document.getElementById('mem-trade').value.trim();
    const site = document.getElementById('mem-site').value;
    const phone = document.getElementById('mem-phone').value.trim();
    apiCall('/api/team', { method: 'POST', body: JSON.stringify({ name: name, trade: trade, site: site, phone: phone }) })
      .then(function () { return loadAdminTeam(); }).then(renderAdminBody).catch(function (err) { alert(err.message); });
  }

  function openAdmin() {
    document.getElementById('admin-backdrop').hidden = false;
    Promise.all([loadAdminAccounts(), loadAdminTeam()]).then(renderAdminBody).catch(function (e) { alert(e.message); });
  }
  function closeAdmin() { document.getElementById('admin-backdrop').hidden = true; }

  function initAdmin() {
    document.getElementById('admin-close').addEventListener('click', closeAdmin);
    document.getElementById('admin-backdrop').addEventListener('click', function (e) {
      if (e.target.id === 'admin-backdrop') closeAdmin();
    });
    document.querySelectorAll('[data-admin-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        ADMIN_TAB = btn.dataset.adminTab;
        document.querySelectorAll('[data-admin-tab]').forEach(function (b) { b.classList.toggle('active', b === btn); });
        if (ADMIN_TAB === 'log' && !ADMIN_LOG.length) loadAuditLog(false);
        else renderAdminBody();
      });
    });
    document.getElementById('admin-body').addEventListener('click', function (e) {
      const el = e.target.closest('[data-admin-action]');
      if (!el) return;
      const id = Number(el.dataset.id);
      if (el.dataset.adminAction === 'reset-password') {
        const pw = prompt('Nouveau mot de passe temporaire (8 caractères min.) :');
        if (!pw) return;
        apiCall('/api/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ action: 'resetPassword', tempPassword: pw }) })
          .then(function () { alert('Mot de passe réinitialisé.'); }).catch(function (err) { alert(err.message); });
      } else if (el.dataset.adminAction === 'delete-user') {
        if (!confirm('Supprimer ce compte de connexion ?')) return;
        apiCall('/api/admin/users/' + id, { method: 'DELETE' }).then(function () { return loadAdminAccounts(); }).then(renderAdminBody).catch(function (err) { alert(err.message); });
      } else if (el.dataset.adminAction === 'toggle-team') {
        const active = el.dataset.active === 'true';
        apiCall('/api/team/' + id, { method: 'PATCH', body: JSON.stringify({ active: active }) })
          .then(function () { return loadAdminTeam(); }).then(renderAdminBody).catch(function (err) { alert(err.message); });
      } else if (el.dataset.adminAction === 'delete-team') {
        if (!confirm('Supprimer définitivement cette personne et toutes ses données (congés, tâches) ? Cette action est irréversible.')) return;
        apiCall('/api/team/' + id, { method: 'DELETE' }).then(function () { return loadAdminTeam(); }).then(renderAdminBody).catch(function (err) { alert(err.message); });
      }
    });
  }

  // ---------- Messagerie d'équipe (lot 04) ----------
  let MSG_LAST_ID = 0;

  function fmtMsgTime(iso) {
    return new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function appendMessages(msgs) {
    const el = document.getElementById('msg-list');
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 30;
    msgs.forEach(function (m) {
      const div = document.createElement('div');
      div.className = 'msg-item';
      div.innerHTML = '<div class="msg-item-head"><span class="msg-item-author">' + esc(m.authorName) +
        '</span><span class="msg-item-time">' + fmtMsgTime(m.createdAt) + '</span></div>' +
        '<div class="msg-item-body">' + esc(m.body) + '</div>';
      el.appendChild(div);
      if (m.id > MSG_LAST_ID) MSG_LAST_ID = m.id;
    });
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  function setMsgBadge(count) {
    const b = document.getElementById('msg-badge');
    if (count > 0) { b.hidden = false; b.textContent = count > 99 ? '99+' : String(count); }
    else { b.hidden = true; }
  }

  function markMessagesRead() {
    if (MSG_LAST_ID) apiCall('/api/messages/read', { method: 'POST', body: JSON.stringify({ lastId: MSG_LAST_ID }) }).catch(function () {});
  }

  function openMessages() {
    document.getElementById('msg-backdrop').hidden = false;
    setMsgBadge(0);
    apiCall('/api/messages').then(function (r) {
      const list = document.getElementById('msg-list');
      list.innerHTML = r.messages.length ? '' : '<div class="msg-empty">Aucun message pour l’instant.</div>';
      MSG_LAST_ID = 0;
      appendMessages(r.messages);
      list.scrollTop = list.scrollHeight;
      markMessagesRead();
    }).catch(function (e) { alert(e.message); });
  }

  function closeMessages() { document.getElementById('msg-backdrop').hidden = true; }

  function initMessaging() {
    const fab = document.getElementById('msg-fab');
    fab.hidden = false;
    fab.addEventListener('click', openMessages);
    document.getElementById('msg-close').addEventListener('click', closeMessages);
    document.getElementById('msg-backdrop').addEventListener('click', function (e) {
      if (e.target.id === 'msg-backdrop') closeMessages();
    });
    document.getElementById('msg-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      apiCall('/api/messages', { method: 'POST', body: JSON.stringify({ body: text }) }).then(function (m) {
        appendMessages([m]);
        document.getElementById('msg-list').scrollTop = document.getElementById('msg-list').scrollHeight;
        markMessagesRead();
      }).catch(function (e) { alert(e.message); input.value = text; });
    });

    setInterval(function () {
      if (!document.getElementById('msg-backdrop').hidden) {
        apiCall('/api/messages?after=' + MSG_LAST_ID).then(function (r) {
          if (r.messages.length) { appendMessages(r.messages); markMessagesRead(); }
        }).catch(function () {});
      } else {
        apiCall('/api/messages/unread-count').then(function (r) { setMsgBadge(r.count); }).catch(function () {});
      }
    }, 8000);
    apiCall('/api/messages/unread-count').then(function (r) { setMsgBadge(r.count); }).catch(function () {});
  }

  // ---------- Mise à jour en direct du planning (lot 03) ----------
  function pollBoardState() {
    if (!SESSION || state.dialog) return;
    apiCall('/api/board-state').then(function (r) {
      const newStatus = {};
      r.taskStatus.forEach(function (row) { newStatus[row.taskId] = row.status; });
      state.status = newStatus;
      r.zones.forEach(function (z) {
        const zone = ZONES.filter(function (x) { return x.id === z.id; })[0];
        if (zone && z.status !== zone.base) state.clean[z.id] = z.status;
        else delete state.clean[z.id];
      });
      render();
    }).catch(function () {});
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }

  function showError(message) {
    document.getElementById('app').innerHTML = '<div class="error-screen"><div>' + esc(message) + '</div>' +
      '<button class="btn btn-secondary" onclick="location.reload()">Réessayer</button></div>';
  }

  Promise.all([
    apiCall('/api/session'),
    apiCall('/api/bootstrap')
  ]).then(function (results) {
    const sessionRes = results[0];
    const boot = results[1];
    if (!sessionRes.authenticated) { window.location.href = '/login.html'; return; }

    SESSION = boot.session;
    STAFF = boot.team.map(function (t) { return { id: t.id, n: t.name, r: t.trade, s: t.site }; });

    ABSENCES = boot.leaves.map(function (l) {
      return {
        pid: l.memberId,
        kind: l.reason || 'Absence',
        from: new Date(l.start + 'T00:00:00'),
        to: new Date(l.end + 'T00:00:00')
      };
    });

    ZONES = boot.zones.map(function (z) { return { id: z.id, site: z.site, name: z.name, base: z.base }; });
    boot.zones.forEach(function (z) { if (z.status !== z.base) state.clean[z.id] = z.status; });

    boot.taskStatus.forEach(function (row) { state.status[row.taskId] = row.status; });

    const staffById = {};
    STAFF.forEach(function (p) { staffById[p.id] = p; });
    boot.extraTasks.forEach(function (row) {
      const d = new Date(row.day + 'T00:00:00');
      const k = key(d);
      const p = staffById[row.memberId];
      if (!p) return;
      const list = state.extra[k] || (state.extra[k] = []);
      list.push({
        id: k + '|x' + row.id + '|' + row.memberId,
        title: row.title, urg: row.urgent ? 'Urgent' : '',
        pid: row.memberId, person: p.n, site: row.site, shift: null, hour: 9
      });
    });

    state.role = SESSION.role === 'manager' ? 'chef' : 'emp';

    render();
    initMessaging();
    initAdmin();
    setInterval(pollBoardState, 20000);
  }).catch(function (e) {
    showError('Impossible de charger les données : ' + e.message);
  });
})();
</script>
</body>
</html>
