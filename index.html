<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résidence Les Cerisiers — Service Technique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --text:#1b1d26;
    --text-muted:rgba(27,29,38,.55);
    --text-faint:rgba(27,29,38,.45);
    --accent:#6157b0;
    --accent-ink:#2b2470;
    --accent-active:#362e80;
    --accent-soft:#e6e3f5;
    --accent-wash:#f2f1f9;
    --divider:rgba(27,29,38,.12);
    --neutral-soft:#e6e8ee;
    --neutral-wash:#f4f5f8;
    --done:#3E7A4E;
    --doing:#C97F1F;
    --doing-ink:#241a00;
    --todo:#B14B33;
    --radius-md:8px;
    --radius-lg:14px;
    --shadow-sm:0 0 0 1px #e6e8ee;
    --shadow-lg:0 0 0 1px #d3d6e1, 0 16px 40px rgba(27,29,38,.15);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  h1,h2,h3{font-family:'Inter',system-ui,sans-serif;font-weight:600;margin:0;letter-spacing:-.01em;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  #app{display:flex;flex-direction:column;min-height:100vh;}

  .app-header{padding:16px 22px 0;flex:none;}
  .header-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;}
  .header-row h1{flex:1 1 260px;min-width:0;font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .role-toggle{flex:none;display:inline-flex;overflow:hidden;border:1px solid var(--divider);border-radius:var(--radius-md);}
  .role-btn{padding:9px 16px;font-size:15px;font-weight:500;cursor:pointer;background:transparent;border:0;color:var(--text);white-space:nowrap;}
  .role-btn+.role-btn{border-left:1px solid var(--divider);}
  .role-btn.active{background:var(--accent-soft);color:var(--accent-ink);}
  .user-box{flex:none;display:flex;align-items:center;gap:10px;}
  .user-id{text-align:right;}
  .user-name{font-size:14px;white-space:nowrap;}
  .user-role{font-size:12.5px;color:var(--text-muted);white-space:nowrap;}
  .avatar{width:34px;height:34px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .avatar.sm{width:27px;height:27px;font-size:11px;}
  .avatar.muted{background:var(--neutral-soft);color:var(--text-faint);}

  .tabs-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 22px;margin-top:14px;box-shadow:inset 0 -1px 0 var(--divider);}
  .tabs{flex:1 1 auto;min-width:0;display:flex;gap:4px;overflow-x:auto;}
  .tab-btn{flex:none;display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;font-size:15px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--text-muted);}
  .tab-btn.active{color:var(--accent-active);border-bottom-color:var(--accent);}
  .tab-count{font-size:13px;padding:1px 7px;border-radius:999px;background:var(--neutral-wash);color:var(--text-faint);}
  .tab-btn.active .tab-count{background:var(--accent-soft);color:var(--accent-ink);}
  .day-nav{flex:none;display:flex;align-items:center;gap:10px;padding-bottom:7px;}
  .icon-btn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;border:1px solid var(--divider);border-radius:var(--radius-md);color:var(--text);font-size:15px;}
  .icon-btn:hover{background:rgba(27,29,38,.05);}
  .day-label{font-size:15px;white-space:nowrap;text-transform:capitalize;color:var(--text-muted);}
  .my-day-label{flex:1 1 auto;min-width:0;display:flex;align-items:center;padding:10px 0 12px;font-size:15px;white-space:nowrap;color:var(--accent-ink);border-bottom:2px solid var(--accent);}

  .week-strip{flex:none;display:flex;align-items:stretch;gap:8px;padding:14px 22px 0;}
  .week-strip-days{flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;}
  .week-card{flex:1 1 0;min-width:116px;display:flex;flex-direction:column;gap:7px;padding:10px 12px 11px;cursor:pointer;text-align:left;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:var(--radius-md);border:0;border-left:4px solid transparent;color:var(--text);}
  .week-card.active{background:var(--accent-wash);box-shadow:var(--shadow-lg);border-left-color:var(--accent);}
  .week-card.is-today:not(.active){border-left-color:var(--neutral-soft);}
  .week-card-top{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .week-card-num{font-size:21px;letter-spacing:-.02em;}
  .week-card-name{font-size:13px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);}
  .week-card.active .week-card-name{color:var(--accent-active);}
  .week-card-counts{display:flex;align-items:center;gap:9px;min-width:0;}
  .week-card-count{flex:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13.5px;}
  .week-card-dot{width:9px;height:9px;flex:none;border-radius:50%;}
  .week-card-task{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  main{flex:1 1 auto;min-height:0;overflow:auto;padding:16px 22px 24px;}
  .section{min-width:0;margin-bottom:22px;}
  .section-head{display:flex;align-items:baseline;gap:11px;padding-bottom:9px;}
  .section-title{font-size:19px;font-weight:500;white-space:nowrap;}
  .section-sub{font-size:14px;white-space:nowrap;color:var(--text-muted);}
  .scroll-x{min-width:0;overflow-x:auto;}
  .grid-box{display:flex;flex-direction:column;gap:1px;background:var(--divider);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
  .grid-head{display:grid;gap:1px;padding:0 0 7px 14px;font-size:13px;color:var(--text-faint);}
  .grid-row{display:grid;gap:1px;}
  .cell{display:flex;align-items:center;min-height:52px;padding:8px 12px;background:var(--surface);border-left:4px solid transparent;}
  .cell.center{justify-content:center;text-align:center;}
  .cell-title{flex:1 1 auto;min-width:0;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cell-sub{display:block;font-size:13.5px;margin-top:2px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill-btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px;cursor:pointer;font-size:14.5px;border:0;white-space:nowrap;}
  .empty-row{display:flex;align-items:center;min-height:52px;padding:10px 16px;background:var(--surface);font-size:14.5px;color:var(--text-faint);}
  .add-row{width:100%;display:flex;align-items:center;gap:9px;min-height:48px;padding:8px 16px;cursor:pointer;text-align:left;font-size:14.5px;background:var(--surface);border:0;border-top:1px solid var(--divider);color:var(--text-muted);}
  .add-row .plus{font-size:17px;color:var(--accent);}
  .add-row:hover{background:rgba(27,29,38,.03);}

  .bar-track{flex:1 1 auto;min-width:0;height:8px;border-radius:4px;background:var(--neutral-soft);}
  .bar-fill{display:block;height:8px;border-radius:4px;}

  .status-card{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding:14px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);margin-bottom:22px;}
  .status-dot{width:13px;height:13px;flex:none;border-radius:50%;}
  .status-label{flex:1 1 200px;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status-shift{flex:none;font-size:15px;color:var(--text-muted);white-space:nowrap;}
  .hint-text{font-size:13.5px;padding-top:9px;color:var(--text-faint);}

  .week-row{width:100%;display:grid;gap:1px;cursor:pointer;text-align:left;color:var(--text);background:transparent;border:0;}
  .week-day{display:flex;align-items:center;min-height:54px;padding:8px 14px;border-left:4px solid transparent;font-size:15px;text-transform:capitalize;white-space:nowrap;}
  .week-state{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px;font-size:14.5px;white-space:nowrap;}
  .week-detail{display:flex;align-items:center;min-height:54px;padding:8px 14px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);}
  .week-tasks{display:flex;align-items:center;justify-content:center;min-height:54px;padding:8px;font-size:14px;white-space:nowrap;color:var(--text-faint);}

  .dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(244,245,248,.72);z-index:200;}
  .dialog{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow-lg);}
  .dialog-title{font-size:20px;font-weight:500;}
  .dialog-body{display:flex;flex-direction:column;gap:12px;font-size:14px;}
  .dialog-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field label{display:block;font-size:12px;margin-bottom:5px;color:var(--text-muted);}
  .field .input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius-md);}
  .field .input:hover{border-color:rgba(27,29,38,.35);}
  .field .input:focus-visible{border-color:var(--accent);outline-offset:0;}
  .dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:500;font-size:14px;padding:8px 14px;border-radius:var(--radius-md);border:1px solid transparent;}
  .btn-secondary{border-color:var(--divider);color:var(--text);}
  .btn-secondary:hover{background:rgba(27,29,38,.05);}
  .btn-primary{border-color:var(--accent);color:var(--accent);}
  .btn-primary:hover{background:rgba(97,87,176,.1);}

  @media (max-width:640px){
    .header-row h1{font-size:22px;}
    .app-header{padding:14px 14px 0;}
    main{padding:14px 14px 20px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const SITES = [
    { id: 'CLF', name: 'Clairefontaine', color: '#4F44B0' },
    { id: 'BMT', name: 'Beaumont', color: '#3F7F94' }
  ];

  const STAFF = [
    { id: 1, n: 'Julien Marchand', r: 'Chef d’équipe', s: 'CLF' },
    { id: 2, n: 'Camille Roussel', r: 'Chef d’équipe', s: 'BMT' },
    { id: 3, n: 'Karim Haddad', r: 'Agent technique', s: 'CLF' },
    { id: 4, n: 'Nicolas Fournier', r: 'Agent technique', s: 'CLF' },
    { id: 5, n: 'Sophie Berthier', r: 'Agent technique', s: 'CLF' },
    { id: 6, n: 'Antoine Lefort', r: 'Agent technique', s: 'CLF' },
    { id: 7, n: 'Claire Dumont', r: 'Agent technique', s: 'CLF' },
    { id: 8, n: 'Mathieu Girard', r: 'Agent technique', s: 'CLF' },
    { id: 9, n: 'Marc Delaunay', r: 'Agent technique', s: 'BMT' },
    { id: 10, n: 'Émilie Charpentier', r: 'Agent technique', s: 'BMT' },
    { id: 11, n: 'Rachid Benali', r: 'Agent technique', s: 'BMT' },
    { id: 12, n: 'Isabelle Faure', r: 'Agent technique', s: 'BMT' },
    { id: 13, n: 'Vincent Picard', r: 'Agent technique', s: 'BMT' },
    { id: 14, n: 'Laura Simon', r: 'Agent technique', s: 'BMT' },
    { id: 15, n: 'Thomas Bertin', r: 'Agent technique', s: 'BMT' }
  ];

  const SHIFTS = {
    matin: { s: 6, short: '06:00 – 14:00', name: 'Matin' },
    aprem: { s: 13.5, short: '13:30 – 21:30', name: 'Après-midi' }
  };

  const STATES = {
    done: { label: 'Terminé', bg: 'var(--done)', fg: '#ffffff' },
    doing: { label: 'En cours', bg: 'var(--doing)', fg: 'var(--doing-ink)' },
    todo: { label: 'À faire', bg: 'var(--todo)', fg: '#ffffff' }
  };
  const CYCLE = { todo: 'doing', doing: 'done', done: 'todo' };

  const PRES = {
    present: { label: 'Présent', bg: 'var(--done)', fg: '#ffffff' },
    moved: { label: 'Autre site', bg: 'var(--doing)', fg: 'var(--doing-ink)' },
    absent: { label: 'Absent', bg: 'var(--todo)', fg: '#ffffff' },
    off: { label: 'Repos', bg: 'var(--neutral-wash)', fg: 'var(--text-faint)' }
  };

  const CLEAN = {
    ok: { label: 'Propre', bg: 'var(--done)', fg: '#ffffff' },
    soon: { label: 'À nettoyer', bg: 'var(--doing)', fg: 'var(--doing-ink)' },
    urgent: { label: 'Urgent', bg: 'var(--todo)', fg: '#ffffff' }
  };
  const CLEAN_CYCLE = { ok: 'soon', soon: 'urgent', urgent: 'ok' };

  const ZONES = [
    { id: 'z1', site: 'CLF', name: 'Hall et couloirs', base: 'ok' },
    { id: 'z2', site: 'CLF', name: 'Salle à manger', base: 'soon' },
    { id: 'z3', site: 'CLF', name: 'Sanitaires 2e étage', base: 'urgent' },
    { id: 'z4', site: 'BMT', name: 'Hall et couloirs', base: 'ok' },
    { id: 'z5', site: 'BMT', name: 'Cuisine', base: 'soon' },
    { id: 'z6', site: 'BMT', name: 'Local déchets', base: 'urgent' }
  ];

  const TASK_POOL = [
    { t: 'Ronde de contrôle chaudière', u: '' },
    { t: 'Remplacer les néons du couloir B', u: '' },
    { t: 'Réparer la barre d’appui ch. 214', u: 'Urgent' },
    { t: 'Relevé des compteurs d’eau', u: '' },
    { t: 'Déboucher l’évier de l’office 2', u: 'Urgent' },
    { t: 'Entretien des espaces verts', u: '' },
    { t: 'Contrôle des issues de secours', u: '' },
    { t: 'Monter le lit médicalisé ch. 108', u: 'Urgent' },
    { t: 'Purger les radiateurs aile Est', u: '' },
    { t: 'Vérifier les détecteurs de fumée', u: '' },
    { t: 'Régler le groupe froid cuisine', u: 'Urgent' },
    { t: 'Peinture de la salle de kiné', u: '' },
    { t: 'Changer les filtres VMC', u: '' },
    { t: 'Réparer le store ch. 301', u: '' }
  ];

  const WORKS = [
    { title: 'Réfection des salles de bain — aile Est', pct: 62, site: 'CLF', who: 'Sophie Berthier', due: 'J-17', late: false },
    { title: 'Mise aux normes électriques du sous-sol', pct: 38, site: 'BMT', who: 'Émilie Charpentier', due: 'En retard', late: true },
    { title: 'Remplacement de la VMC cuisine', pct: 80, site: 'CLF', who: 'Antoine Lefort', due: 'J-4', late: false },
    { title: 'Réaménagement du local technique', pct: 15, site: 'BMT', who: 'Isabelle Faure', due: 'J-31', late: false }
  ];

  const DAY = 86400000;
  function initials(n) { return n.split(' ').map(function (p) { return p[0]; }).join('').slice(0, 2).toUpperCase(); }
  function key(d) { return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function dayIndex(d) { return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function hourLabel(h) { return (h % 1 ? Math.floor(h) + 'h30' : h + 'h00'); }
  function siteName(id) { return id === 'CLF' ? 'Clairefontaine' : 'Beaumont'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' }[c]; }); }

  const fmtDayFull = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtShort = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' });
  const fmtWeekday = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric' });
  const fmtDayName = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' });

  const today = startOfDay(new Date());
  const ABSENCES = [
    { pid: 4, kind: 'Congés payés', from: addDays(today, 2), to: addDays(today, 9) },
    { pid: 11, kind: 'Arrêt maladie', from: addDays(today, -1), to: addDays(today, 4) },
    { pid: 8, kind: 'Congés payés', from: addDays(today, 15), to: addDays(today, 22) },
    { pid: 13, kind: 'Formation', from: addDays(today, 6), to: addDays(today, 7) },
    { pid: 6, kind: 'Récupération', from: addDays(today, 3), to: addDays(today, 3) }
  ];

  const state = {
    role: 'chef', tab: 'planning', selected: today,
    status: {}, clean: {}, extra: {},
    dialog: false
  };

  function absenceFor(pid, d) {
    const t = d.getTime();
    for (let i = 0; i < ABSENCES.length; i++) {
      const a = ABSENCES[i];
      if (a.pid === pid && t >= a.from.getTime() && t <= a.to.getTime()) return a;
    }
    return null;
  }

  function roster(d) {
    const di = dayIndex(d);
    const dow = d.getDay();
    const weekend = dow === 0 || dow === 6;
    return STAFF.map(function (p, i) {
      const abs = absenceFor(p.id, d);
      let shift = null;
      const r = (i * 2 + di) % 5;
      if (!abs) {
        if (weekend) shift = r === 0 ? 'matin' : (r === 1 ? 'aprem' : null);
        else shift = r < 2 ? 'matin' : (r < 4 ? 'aprem' : null);
      }
      const lent = !!shift && (i + di) % 5 === 4;
      return { p: p, shift: shift, abs: abs, site: lent ? (p.s === 'CLF' ? 'BMT' : 'CLF') : p.s, lent: lent };
    });
  }

  function baseState(d, seed) {
    const diff = Math.round((d.getTime() - today.getTime()) / DAY);
    if (diff < 0) return seed % 6 === 0 ? 'doing' : 'done';
    if (diff === 0) return seed % 3 === 0 ? 'done' : (seed % 3 === 1 ? 'doing' : 'todo');
    return seed % 7 === 0 ? 'doing' : 'todo';
  }

  function tasksFor(d) {
    const di = dayIndex(d);
    const k = key(d);
    const out = [];
    roster(d).forEach(function (row, i) {
      if (!row.shift) return;
      if ((i + di) % 2 === 1) return;
      const src = TASK_POOL[(i * 5 + di * 3) % TASK_POOL.length];
      const id = k + '|' + row.p.id;
      out.push({
        id: id, title: src.t, urg: src.u, pid: row.p.id, person: row.p.n,
        site: row.site, shift: row.shift, hour: SHIFTS[row.shift].s + 1,
        state: state.status[id] || baseState(d, i + di)
      });
    });
    (state.extra[k] || []).forEach(function (t) {
      out.push(Object.assign({}, t, { state: state.status[t.id] || 'todo' }));
    });
    return out;
  }

  function setStatus(id, cur) {
    state.status[id] = CYCLE[cur];
    render();
  }

  function taskRow(t) {
    const st = STATES[t.state];
    return {
      id: t.id,
      title: t.title,
      who: t.person,
      initials: initials(t.person),
      status: st.label, statusBg: st.bg, statusFg: st.fg,
      slot: t.shift ? SHIFTS[t.shift].name : hourLabel(t.hour),
      meta: siteName(t.site) + ' · ' + hourLabel(t.hour),
      urg: t.urg, urgFg: t.urg ? 'var(--todo)' : 'transparent',
      op: t.state === 'done' ? '0.55' : '1',
      deco: t.state === 'done' ? 'line-through' : 'none'
    };
  }

  function planningGroups(sel, tasks) {
    const rank = { todo: 0, doing: 1, done: 2 };
    return SITES.map(function (st) {
      const rows = tasks.filter(function (t) { return t.site === st.id; }).sort(function (a, b) {
        if (rank[a.state] !== rank[b.state]) return rank[a.state] - rank[b.state];
        return (b.urg ? 1 : 0) - (a.urg ? 1 : 0);
      });
      const done = rows.filter(function (t) { return t.state === 'done'; }).length;
      return {
        id: st.id, name: st.name, color: st.color,
        summary: rows.length ? done + ' / ' + rows.length + ' terminées' : 'aucune tâche',
        rows: rows.map(taskRow)
      };
    });
  }

  function teamGroups(roster_) {
    return SITES.map(function (st) {
      const here = roster_.filter(function (r) { return r.shift && r.site === st.id; });
      const off = roster_.filter(function (r) { return !r.shift && r.p.s === st.id; });
      const rows = [];
      here.forEach(function (r) {
        const p = r.lent ? PRES.moved : PRES.present;
        rows.push({
          name: r.p.n, initials: initials(r.p.n), muted: false,
          state: p.label, stateBg: p.bg, stateFg: p.fg,
          slot: SHIFTS[r.shift].name,
          detail: r.lent ? 'prêté depuis ' + siteName(r.p.s) : SHIFTS[r.shift].short
        });
      });
      off.forEach(function (r) {
        const p = r.abs ? PRES.absent : PRES.off;
        rows.push({
          name: r.p.n, initials: initials(r.p.n), muted: true,
          state: p.label, stateBg: p.bg, stateFg: p.fg,
          slot: '—',
          detail: r.abs ? r.abs.kind : 'Jour de repos'
        });
      });
      return {
        name: st.name, color: st.color,
        summary: here.length + ' au poste · ' + off.filter(function (r) { return r.abs; }).length + ' absents',
        people: rows
      };
    });
  }

  function worksData() {
    const urgentZones = ZONES.filter(function (z) { return (state.clean[z.id] || z.base) === 'urgent'; }).length;
    const works = WORKS.map(function (w) {
      const st = SITES.filter(function (x) { return x.id === w.site; })[0];
      return {
        title: w.title, pct: w.pct, who: w.who, initials: initials(w.who),
        site: siteName(w.site), mark: st.color,
        barFg: w.late ? 'var(--doing)' : 'var(--accent)',
        due: w.due, dueFg: w.late ? 'var(--todo)' : 'var(--text-muted)'
      };
    });
    const zones = ZONES.map(function (z) {
      const st = state.clean[z.id] || z.base;
      const c = CLEAN[st];
      const site = SITES.filter(function (x) { return x.id === z.site; })[0];
      return { id: z.id, name: z.name, site: siteName(z.site), mark: site.color, label: c.label, bg: c.bg, fg: c.fg };
    });
    return {
      worksSummary: WORKS.length + ' en cours · ' + WORKS.filter(function (w) { return w.late; }).length + ' en retard',
      works: works, zones: zones,
      cleanAlert: urgentZones ? urgentZones + ' zone' + (urgentZones > 1 ? 's' : '') + ' à traiter en urgence' : 'rien d’urgent',
      cleanAlertFg: urgentZones ? 'var(--todo)' : 'var(--text-faint)'
    };
  }

  function computeVals() {
    const s = state;
    const sel = s.selected;
    const isChef = s.role === 'chef';
    const ros = roster(sel);
    const tasks = tasksFor(sel);

    let me = STAFF[0];
    if (!isChef) {
      for (let i = 0; i < ros.length; i++) {
        if (ros[i].p.r === 'Agent technique' && ros[i].shift) { me = ros[i].p; break; }
      }
    }

    const tab = isChef ? s.tab : 'mine';
    const openTasks = tasks.filter(function (t) { return t.state !== 'done'; }).length;
    const urgentZones = ZONES.filter(function (z) { return (s.clean[z.id] || z.base) === 'urgent'; }).length;

    const tabs = [
      { id: 'planning', label: 'Tâches du jour', count: openTasks },
      { id: 'team', label: 'Qui est où', count: ros.filter(function (r) { return r.shift; }).length },
      { id: 'works', label: 'Chantiers et propreté', count: WORKS.length + urgentZones }
    ];

    const vals = {
      isChef: isChef, isEmp: !isChef, tab: tab,
      userName: me.n,
      userRole: isChef ? 'Chef d’équipe' : me.r + ' · ' + siteName(me.s),
      userInitials: initials(me.n),
      dayLabel: sel.getTime() === today.getTime() ? 'Aujourd’hui · ' + fmtShort.format(sel) : fmtDayFull.format(sel),
      tabs: tabs
    };

    const stripStart = addDays(sel, -((sel.getDay() + 6) % 7));
    vals.weekDays = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(stripStart, i);
      const on = d.getTime() === sel.getTime();
      const isToday = d.getTime() === today.getTime();
      const rst = roster(d);
      const ts = tasksFor(d);
      const openN = ts.filter(function (t) { return t.state !== 'done'; }).length;
      vals.weekDays.push({
        iso: d.toISOString().slice(0, 10),
        num: d.getDate(),
        dayName: fmtDayName.format(d),
        active: on, isToday: isToday,
        presentN: rst.filter(function (r) { return r.shift; }).length,
        absentN: rst.filter(function (r) { return r.abs; }).length,
        taskLabel: openN ? openN + ' à faire' : 'tout est fait',
        taskFg: openN ? 'var(--todo)' : 'var(--text-faint)'
      });
    }

    if (isChef && tab === 'planning') vals.groups = planningGroups(sel, tasks);
    if (isChef && tab === 'team') vals.teamGroups = teamGroups(ros);
    if (isChef && tab === 'works') Object.assign(vals, worksData());

    if (tab === 'mine') {
      const myRow = ros.filter(function (r) { return r.p.id === me.id; })[0];
      const myState = myRow && myRow.shift ? (myRow.lent ? PRES.moved : PRES.present) : (myRow && myRow.abs ? PRES.absent : PRES.off);
      vals.myStatusColor = myState.bg;
      vals.myStatusLabel = myRow && myRow.shift
        ? 'Site de ' + siteName(myRow.site) + (myRow.lent ? ' (prêté)' : '')
        : (myRow && myRow.abs ? myRow.abs.kind : 'Jour de repos');
      vals.myShiftLabel = myRow && myRow.shift ? SHIFTS[myRow.shift].short : '';
      const mine = tasks.filter(function (t) { return t.pid === me.id; });
      vals.myTasks = mine.map(taskRow);
      vals.myEmptyLabel = myRow && myRow.shift ? 'Aucune tâche assignée' : 'Pas de service ce jour';
      vals.myProgress = mine.length ? mine.filter(function (t) { return t.state === 'done'; }).length + ' / ' + mine.length + ' terminées' : '';

      const wStart = stripStart;
      vals.weekLabel = 'du ' + fmtShort.format(wStart) + ' au ' + fmtShort.format(addDays(wStart, 6));
      const myWeek = [];
      for (let i = 0; i < 7; i++) {
        const d = addDays(wStart, i);
        const row = roster(d).filter(function (r) { return r.p.id === me.id; })[0];
        const n = tasksFor(d).filter(function (t) { return t.pid === me.id; }).length;
        const p = row.shift ? (row.lent ? PRES.moved : PRES.present) : (row.abs ? PRES.absent : PRES.off);
        const on = d.getTime() === sel.getTime();
        myWeek.push({
          date: key(d), iso: d.toISOString().slice(0, 10),
          day: fmtWeekday.format(d),
          dayFg: on ? 'var(--accent-active)' : 'var(--text)',
          mark: on ? 'var(--accent)' : 'transparent',
          rowBg: on ? 'var(--accent-wash)' : 'var(--surface)',
          state: p.label, stateBg: p.bg, stateFg: p.fg,
          detail: row.shift ? SHIFTS[row.shift].short + ' · ' + siteName(row.site) : (row.abs ? row.abs.kind : 'Repos'),
          tasks: row.shift && n ? n + (n > 1 ? ' tâches' : ' tâche') : ''
        });
      }
      vals.myWeek = myWeek;
    }

    return vals;
  }

  function headerHtml(v) {
    return '' +
      '<div class="header-row">' +
        '<h1>Service technique</h1>' +
        '<div class="role-toggle">' +
          '<button class="role-btn' + (v.isChef ? ' active' : '') + '" data-action="role" data-role="chef">Chef d’équipe</button>' +
          '<button class="role-btn' + (!v.isChef ? ' active' : '') + '" data-action="role" data-role="emp">Employé</button>' +
        '</div>' +
        '<div class="user-box">' +
          '<div class="user-id">' +
            '<div class="user-name">' + esc(v.userName) + '</div>' +
            '<div class="user-role">' + esc(v.userRole) + '</div>' +
          '</div>' +
          '<div class="avatar">' + esc(v.userInitials) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tabs-row">' +
        (v.isChef ?
          '<div class="tabs">' +
            v.tabs.map(function (t) {
              const on = v.tab === t.id;
              return '<button class="tab-btn' + (on ? ' active' : '') + '" data-action="tab" data-tab="' + t.id + '">' +
                esc(t.label) + '<span class="tab-count">' + t.count + '</span></button>';
            }).join('') +
          '</div>'
        : '<div class="my-day-label">Ma journée</div>') +
        '<div class="day-nav"><span class="day-label">' + esc(v.dayLabel) + '</span></div>' +
      '</div>' +
      '<div class="week-strip">' +
        '<button class="icon-btn" data-action="prev-week">←</button>' +
        '<div class="week-strip-days">' +
          v.weekDays.map(function (d) {
            return '<button class="week-card' + (d.active ? ' active' : '') + (d.isToday ? ' is-today' : '') + '" data-action="pick-day" data-date="' + d.iso + '">' +
              '<span class="week-card-top"><span class="week-card-num">' + d.num + '</span><span class="week-card-name">' + esc(d.dayName) + '</span></span>' +
              '<span class="week-card-counts">' +
                '<span class="week-card-count"><span class="week-card-dot" style="background:var(--done)"></span>' + d.presentN + '</span>' +
                '<span class="week-card-count"><span class="week-card-dot" style="background:var(--todo)"></span>' + d.absentN + '</span>' +
              '</span>' +
              '<span class="week-card-task" style="color:' + d.taskFg + '">' + esc(d.taskLabel) + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
        '<button class="icon-btn" data-action="next-week">→</button>' +
      '</div>';
  }

  function planningHtml(v) {
    return '<div>' + v.groups.map(function (g) {
      const rowsHtml = g.rows.length ? g.rows.map(function (r) {
        return '<div class="grid-row" style="grid-template-columns:minmax(0,2.2fr) 152px 128px 118px 96px">' +
          '<span class="cell" style="border-left-color:' + g.color + '"><span class="cell-title" style="opacity:' + r.op + ';text-decoration:' + r.deco + '">' + esc(r.title) + '</span></span>' +
          '<span class="cell" style="gap:9px"><span class="avatar sm">' + esc(r.initials) + '</span><span class="cell-title">' + esc(r.who) + '</span></span>' +
          '<button class="pill-btn" data-action="cycle-task" data-id="' + esc(r.id) + '" style="background:' + r.statusBg + ';color:' + r.statusFg + '">' + esc(r.status) + '</button>' +
          '<span class="cell center" style="color:var(--text-muted)">' + esc(r.slot) + '</span>' +
          '<span class="cell center" style="color:' + r.urgFg + '">' + esc(r.urg) + '</span>' +
        '</div>';
      }).join('') : '<div class="empty-row">Aucune tâche sur ce site</div>';
      return '<div class="section">' +
        '<div class="section-head"><span class="section-title" style="color:' + g.color + '">' + esc(g.name) + '</span><span class="section-sub">' + esc(g.summary) + '</span></div>' +
        '<div class="scroll-x"><div style="min-width:720px">' +
          '<div class="grid-head" style="grid-template-columns:minmax(0,2.2fr) 152px 128px 118px 96px;padding-left:14px"><span>Tâche</span><span>Qui</span><span style="text-align:center">Statut</span><span style="text-align:center">Créneau</span><span style="text-align:center">Urgence</span></div>' +
          '<div class="grid-box">' + rowsHtml + '<button class="add-row" data-action="add-task" data-site="' + g.id + '"><span class="plus">+</span> Ajouter une tâche</button></div>' +
        '</div></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function teamHtml(v) {
    return '<div>' + v.teamGroups.map(function (g) {
      const rowsHtml = g.people.map(function (p) {
        return '<div class="grid-row" style="grid-template-columns:minmax(0,2fr) 148px 132px minmax(0,1.4fr)">' +
          '<span class="cell" style="border-left-color:' + g.color + ';gap:11px"><span class="avatar sm' + (p.muted ? ' muted' : '') + '">' + esc(p.initials) + '</span><span class="cell-title">' + esc(p.name) + '</span></span>' +
          '<span class="cell center" style="background:' + p.stateBg + ';color:' + p.stateFg + '">' + esc(p.state) + '</span>' +
          '<span class="cell center" style="color:var(--text-muted)">' + esc(p.slot) + '</span>' +
          '<span class="cell" style="color:var(--text-muted)">' + esc(p.detail) + '</span>' +
        '</div>';
      }).join('');
      return '<div class="section">' +
        '<div class="section-head"><span class="section-title" style="color:' + g.color + '">' + esc(g.name) + '</span><span class="section-sub">' + esc(g.summary) + '</span></div>' +
        '<div class="scroll-x"><div style="min-width:640px">' +
          '<div class="grid-head" style="grid-template-columns:minmax(0,2fr) 148px 132px minmax(0,1.4fr);padding-left:14px"><span>Salarié</span><span style="text-align:center">Présence</span><span style="text-align:center">Créneau</span><span>Détail</span></div>' +
          '<div class="grid-box">' + rowsHtml + '</div>' +
        '</div></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function worksHtml(v) {
    const worksRows = v.works.map(function (w) {
      return '<div class="grid-row" style="grid-template-columns:minmax(0,2.2fr) 152px 108px minmax(0,1.3fr) 108px">' +
        '<span class="cell" style="border-left-color:' + w.mark + '"><span class="cell-title">' + esc(w.title) + '</span></span>' +
        '<span class="cell" style="gap:9px"><span class="avatar sm">' + esc(w.initials) + '</span><span class="cell-title">' + esc(w.who) + '</span></span>' +
        '<span class="cell center" style="color:var(--text-muted)">' + esc(w.site) + '</span>' +
        '<span class="cell" style="gap:10px"><span class="bar-track"><span class="bar-fill" style="background:' + w.barFg + ';width:' + w.pct + '%"></span></span><span style="flex:none;font-size:13.5px;color:var(--text-muted)">' + w.pct + '%</span></span>' +
        '<span class="cell center" style="color:' + w.dueFg + '">' + esc(w.due) + '</span>' +
      '</div>';
    }).join('');
    const zoneRows = v.zones.map(function (z) {
      return '<div class="grid-row" style="grid-template-columns:minmax(0,2fr) 108px 152px">' +
        '<span class="cell" style="border-left-color:' + z.mark + '"><span class="cell-title">' + esc(z.name) + '</span></span>' +
        '<span class="cell center" style="color:var(--text-muted)">' + esc(z.site) + '</span>' +
        '<button class="pill-btn" data-action="cycle-zone" data-id="' + z.id + '" style="background:' + z.bg + ';color:' + z.fg + '">' + esc(z.label) + '</button>' +
      '</div>';
    }).join('');
    return '<div>' +
      '<div class="section">' +
        '<div class="section-head"><span class="section-title">Chantiers ouverts</span><span class="section-sub">' + esc(v.worksSummary) + '</span></div>' +
        '<div class="scroll-x"><div style="min-width:700px">' +
          '<div class="grid-head" style="grid-template-columns:minmax(0,2.2fr) 152px 108px minmax(0,1.3fr) 108px;padding-left:14px"><span>Chantier</span><span>Responsable</span><span style="text-align:center">Site</span><span>Avancement</span><span style="text-align:center">Échéance</span></div>' +
          '<div class="grid-box">' + worksRows + '</div>' +
        '</div></div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><span class="section-title">Propreté par site</span><span class="section-sub" style="color:' + v.cleanAlertFg + '">' + esc(v.cleanAlert) + '</span></div>' +
        '<div class="scroll-x"><div style="min-width:560px">' +
          '<div class="grid-head" style="grid-template-columns:minmax(0,2fr) 108px 152px;padding-left:14px"><span>Zone</span><span style="text-align:center">Site</span><span style="text-align:center">État</span></div>' +
          '<div class="grid-box">' + zoneRows + '</div>' +
        '</div></div>' +
      '</div>' +
    '</div>';
  }

  function mineHtml(v) {
    const taskRows = v.myTasks.length ? v.myTasks.map(function (r) {
      return '<div class="grid-row" style="grid-template-columns:minmax(0,1fr) 118px 140px">' +
        '<span class="cell" style="min-height:62px;border-left-color:var(--accent)"><span><span class="cell-title" style="display:block;font-size:17px;opacity:' + r.op + ';text-decoration:' + r.deco + '">' + esc(r.title) + '</span><span class="cell-sub">' + esc(r.meta) + '</span></span></span>' +
        '<span class="cell center" style="min-height:62px;color:' + r.urgFg + '">' + esc(r.urg) + '</span>' +
        '<button class="pill-btn" data-action="cycle-task" data-id="' + esc(r.id) + '" style="min-height:62px;background:' + r.statusBg + ';color:' + r.statusFg + '">' + esc(r.status) + '</button>' +
      '</div>';
    }).join('') : '<div class="empty-row" style="min-height:58px">' + esc(v.myEmptyLabel) + '</div>';

    const weekRows = v.myWeek.map(function (d) {
      return '<button class="week-row" data-action="pick-day" data-date="' + d.iso + '" style="grid-template-columns:128px 132px minmax(0,1fr) 104px">' +
        '<span class="week-day" style="background:' + d.rowBg + ';border-left-color:' + d.mark + ';color:' + d.dayFg + '">' + esc(d.day) + '</span>' +
        '<span class="week-state" style="background:' + d.stateBg + ';color:' + d.stateFg + '">' + esc(d.state) + '</span>' +
        '<span class="week-detail" style="background:' + d.rowBg + '">' + esc(d.detail) + '</span>' +
        '<span class="week-tasks" style="background:' + d.rowBg + '">' + esc(d.tasks) + '</span>' +
      '</button>';
    }).join('');

    return '<div style="max-width:860px">' +
      '<div class="status-card">' +
        '<span class="status-dot" style="background:' + v.myStatusColor + '"></span>' +
        '<span class="status-label">' + esc(v.myStatusLabel) + '</span>' +
        '<span class="status-shift">' + esc(v.myShiftLabel) + '</span>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><span class="section-title">Mes tâches</span><span class="section-sub">' + esc(v.myProgress) + '</span></div>' +
        '<div class="grid-box">' + taskRows + '</div>' +
        '<div class="hint-text">Touchez le statut pour le changer.</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><span class="section-title">Ma semaine</span><span class="section-sub">' + esc(v.weekLabel) + '</span></div>' +
        '<div class="grid-box">' + weekRows + '</div>' +
      '</div>' +
    '</div>';
  }

  function dialogHtml() {
    if (!state.dialog) return '';
    const staffOptions = STAFF.filter(function (p) { return p.r === 'Agent technique'; })
      .map(function (p) { return '<option value="' + p.id + '"' + (p.id === state.dialog.person ? ' selected' : '') + '>' + esc(p.n + ' · ' + p.r) + '</option>'; }).join('');
    const siteOptions = SITES.map(function (s) { return '<option value="' + s.id + '"' + (s.id === state.dialog.site ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
    return '<div class="dialog-backdrop" data-action="dialog-backdrop">' +
      '<div class="dialog">' +
        '<div class="dialog-title">Nouvelle tâche</div>' +
        '<div class="dialog-body">' +
          '<div class="field"><label>Quoi</label><input class="input" id="dlg-title" placeholder="Ex. Réparer la porte du local 12"></div>' +
          '<div class="field"><label>Qui</label><select class="input" id="dlg-person">' + staffOptions + '</select></div>' +
          '<div class="dialog-row">' +
            '<div class="field"><label>Où</label><select class="input" id="dlg-site">' + siteOptions + '</select></div>' +
            '<div class="field"><label>Urgence</label><select class="input" id="dlg-urg"><option value="Normal">Normal</option><option value="Urgent">Urgent</option></select></div>' +
          '</div>' +
        '</div>' +
        '<div class="dialog-actions">' +
          '<button class="btn btn-secondary" data-action="dialog-close">Annuler</button>' +
          '<button class="btn btn-primary" data-action="dialog-submit">Ajouter</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function render() {
    const v = computeVals();
    let mainHtml;
    if (v.tab === 'planning') mainHtml = planningHtml(v);
    else if (v.tab === 'team') mainHtml = teamHtml(v);
    else if (v.tab === 'works') mainHtml = worksHtml(v);
    else mainHtml = mineHtml(v);

    document.getElementById('app').innerHTML =
      '<header class="app-header">' + headerHtml(v) + '</header>' +
      '<main>' + mainHtml + '</main>' +
      dialogHtml();
  }

  document.getElementById('app').addEventListener('click', function (e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'role') { state.role = el.dataset.role; if (state.role === 'chef') state.tab = 'planning'; render(); }
    else if (action === 'tab') { if (state.role === 'chef') { state.tab = el.dataset.tab; render(); } }
    else if (action === 'prev-week') { state.selected = addDays(state.selected, -7); render(); }
    else if (action === 'next-week') { state.selected = addDays(state.selected, 7); render(); }
    else if (action === 'cycle-task') {
      const id = el.dataset.id;
      const tasks = tasksFor(state.selected);
      const t = tasks.filter(function (x) { return x.id === id; })[0];
      if (t) setStatus(id, t.state);
    }
    else if (action === 'cycle-zone') {
      const id = el.dataset.id;
      const z = ZONES.filter(function (x) { return x.id === id; })[0];
      const cur = state.clean[id] || z.base;
      state.clean[id] = CLEAN_CYCLE[cur];
      render();
    }
    else if (action === 'add-task') {
      state.dialog = { title: '', person: 3, site: el.dataset.site, urg: 'Normal' };
      render();
    }
    else if (action === 'dialog-backdrop') { if (e.target !== el) return; state.dialog = false; render(); }
    else if (action === 'dialog-close') { state.dialog = false; render(); }
    else if (action === 'dialog-submit') {
      const title = document.getElementById('dlg-title').value.trim();
      if (title) {
        const pid = Number(document.getElementById('dlg-person').value);
        const site = document.getElementById('dlg-site').value;
        const urg = document.getElementById('dlg-urg').value;
        const p = STAFF.filter(function (x) { return x.id === pid; })[0];
        const selKey = key(state.selected);
        const list = (state.extra[selKey] || []).slice();
        list.push({
          id: selKey + '|x' + list.length + '|' + pid,
          title: title, urg: urg === 'Urgent' ? 'Urgent' : '',
          pid: pid, person: p.n, site: site, shift: null, hour: 9
        });
        state.extra[selKey] = list;
      }
      state.dialog = false;
      render();
    }
    else if (action === 'pick-day') { state.selected = new Date(el.dataset.date + 'T00:00:00'); render(); }
  });

  render();
})();
</script>
</body>
</html>
